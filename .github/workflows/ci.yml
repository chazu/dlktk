name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check witness regressions and rescore saved sessions
        working-directory: benchmarks/witness
        run: |
          python3 -m unittest -v test_diagnostics
          python3 score.py --suite extension extension.jsonl > /dev/null

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # Dogfood: the shipped example dialectics must import cleanly and their
  # recorded decisions must still be justified (no drift, no invariant
  # violations). `check` exits 5 on findings, failing the job.
  dialectics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o dlktk ./cmd/dlktk
      - run: python3 .github/scripts/check_examples.py ./dlktk
      # The reference deliberation harness must run end to end (AGENTS.md).
      - run: DLKTK=$PWD/dlktk ./examples/deliberate.sh
      - name: Run the README quickstart
        env:
          DLKTK: ${{ github.workspace }}/dlktk
        run: |
          awk '/^## Quickstart$/ {section=1; next} section && /^```bash$/ {code=1; next} code && /^```$/ {exit} code' README.md > "$RUNNER_TEMP/quickstart.sh"
          test -s "$RUNNER_TEMP/quickstart.sh"
          bash "$RUNNER_TEMP/quickstart.sh"
