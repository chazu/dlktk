<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objection review · dlktk</title>
<style>
:root {color-scheme:light;--ink:#1c322b;--green:#215c48;--line:#ced6cb;--paper:#faf9f3}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.48 "Source Sans 3",system-ui,sans-serif}
header{background:#183e32;color:#fff;padding:14px max(5vw,20px);display:flex;align-items:center;gap:20px}
header strong,small,nav a{font-family:"IBM Plex Mono",monospace}header strong{font-size:19px}header span:last-child{margin-left:auto;font-size:14px}
main{display:grid;grid-template-columns:180px minmax(0,720px);justify-content:center;gap:clamp(30px,6vw,100px);padding:26px 5vw 50px}
nav{border-right:1px solid var(--line);padding-right:20px}nav h3{font-size:13px;margin:14px 0 3px}nav a{display:flex;justify-content:space-between;padding:2px 8px;color:var(--green);font-size:13px;text-decoration:none;border-radius:4px}
nav a:hover,nav a[aria-current]{background:#dce9dc}article{min-width:0}small{color:var(--green)}h1,legend{font-family:"Source Serif 4",Georgia,serif}
h1{font-size:clamp(30px,4vw,44px);line-height:1.07;margin:6px 0 18px;font-weight:500}section{padding:10px 0;border-top:1px solid var(--line)}
section h2{font-size:13px;margin:0;color:var(--green)}p{margin:4px 0}section:last-of-type{background:#e7eee4;padding:12px 16px;border-left:3px solid var(--green)}
fieldset{border:0;margin:20px 0 12px;padding:0}legend{font-weight:600;font-size:22px;margin-bottom:8px}fieldset label{display:block;cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:5px;margin:4px 0;background:#fff}
fieldset label:has(:checked){background:#deebdf;border-color:var(--green)}input{accent-color:var(--green)}label[for]{font-size:14px;font-weight:600}em{font-weight:400}textarea{width:100%;display:block;border:1px solid var(--line);border-radius:5px;background:white;font:inherit;padding:6px 10px;margin:5px 0 10px;resize:vertical}button{border:0;background:var(--green);color:white;padding:9px 16px;font:inherit;font-weight:600;border-radius:5px;cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b7822d;outline-offset:2px}
@media(max-width:720px){main{display:flex;flex-direction:column;gap:24px}nav{order:2;border:0;border-top:1px solid var(--line)}nav a{display:inline-flex;gap:8px;margin-right:6px}header{gap:10px}header span:last-child{font-size:12px}}
</style></head><body><header><strong>dlktk</strong><span>Objection review</span><span>$count of $total reviewed</span></header>
<main><nav aria-label="Review cases">$nav</nav><article>$content</article></main></body></html>
